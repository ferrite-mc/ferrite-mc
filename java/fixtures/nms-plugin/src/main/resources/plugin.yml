name: FerriteNmsFixture
version: 0.1.0
main: dev.ferrite.fixtures.nms.NmsFixturePlugin
api-version: '26.3'
load: POSTWORLD
folia-supported: true
description: Exercises Ferrite's selected clean-room NMS surface end to end.
commands:
  nms-entity:
    description: Probes a non-player entity via entity.state_get.
    usage: /nms-entity <uuid>
  nms-player:
    description: Probes an online player via CraftPlayer#getHandle / player.state_get.
    usage: /nms-player <name>
