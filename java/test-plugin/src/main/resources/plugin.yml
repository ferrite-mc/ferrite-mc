name: FerriteTest
version: 1.0
main: dev.ferrite.test.TestPlugin
api-version: '26.3'
commands:
  ferrite-test:
    aliases: [ft]
    description: Test command
    permission: ferrite.test
  verify-features:
    description: Exercises client-visible API calls for the end-to-end check
    usage: /verify-features
  testping:
    aliases: [tping]
    description: Replies pong
    usage: /testping
  test-inventory:
    description: Opens a plugin inventory for the lifecycle integration test
    usage: /test-inventory
  verify-item:
    description: Sets PDC and item flags through the real inventory slot path
    usage: /verify-item
  drag-setup:
    description: Puts a stack in the hotbar so the bot can drag it
    usage: /drag-setup
  gap7:
    description: Drives the runtime world end-to-end check
    usage: /gap7 <check|enter|leave|spawn|entities|unload|reopen>
  worldcycle:
    description: Creates then unloads a runtime world directly on the command thread
    usage: /worldcycle
depend: [FerriteAlias]
folia-supported: true
