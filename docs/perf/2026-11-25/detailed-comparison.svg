<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" width="1120" height="680" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="ferriteBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="680" fill="url(#bg)" rx="12"/>

  <text x="36" y="42" fill="#f8fafc" font-size="22" font-weight="700">Ferrite 26.3 vs Pumpkin · Folia · Paper · Vanilla — Detailed Benchmark (2026-11-25)</text>
  <text x="36" y="66" fill="#94a3b8" font-size="13">12-vCPU Xeon Platinum 8358 · 62 GiB RAM · MC 26.3 (Protocol 777) · Wild seed=0 · view-distance=8 · online-mode=false</text>

  <!-- Legend -->
  <g transform="translate(36, 82)" font-size="12" fill="#cbd5e1">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#f97316"/><text x="18" y="10" font-weight="700" fill="#fb923c">Ferrite (Rust)</text>
    <rect x="125" y="0" width="12" height="12" rx="2" fill="#a855f7"/><text x="143" y="10">Pumpkin 0.2.2 (Rust)</text>
    <rect x="285" y="0" width="12" height="12" rx="2" fill="#3b82f6"/><text x="303" y="10">Folia 26.3 (Java)</text>
    <rect x="425" y="0" width="12" height="12" rx="2" fill="#06b6d4"/><text x="443" y="10">Paper 26.3 (Java)</text>
    <rect x="565" y="0" width="12" height="12" rx="2" fill="#64748b"/><text x="583" y="10">Vanilla 26.3 (Java)</text>
  </g>

  <!-- Panel 1: SLP Throughput (c=64, 2000 reqs) & c=32 -->
  <g transform="translate(36, 114)">
    <rect width="510" height="250" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="28" fill="#f1f5f9" font-size="15" font-weight="700">1. SLP Throughput (c=64, 2,000 reqs · Higher is Better)</text>
    <text x="20" y="46" fill="#94a3b8" font-size="11.5">Ferrite leads at c=1 (4,027/s), c=32 (7,057/s), and c=64 (7,203/s)</text>

    <!-- Max 7500 -> width 320 -->
    <g transform="translate(20, 68)" font-size="12">
      <text x="0" y="18" fill="#fb923c" font-weight="700">Ferrite</text>
      <rect x="95" y="5" width="307" height="20" rx="4" fill="url(#ferriteBar)"/>
      <text x="410" y="19" fill="#f8fafc" font-weight="700">7,203 /s (p50 5.8ms)</text>

      <text x="0" y="54" fill="#e2e8f0">Pumpkin</text>
      <rect x="95" y="41" width="266" height="20" rx="4" fill="#a855f7"/>
      <text x="369" y="55" fill="#cbd5e1">6,241 /s (p50 7.3ms)</text>

      <text x="0" y="90" fill="#e2e8f0">Vanilla</text>
      <rect x="95" y="77" width="219" height="20" rx="4" fill="#64748b"/>
      <text x="322" y="91" fill="#cbd5e1">5,131 /s (p50 8.8ms)</text>

      <text x="0" y="126" fill="#e2e8f0">Paper</text>
      <rect x="95" y="113" width="210" height="20" rx="4" fill="#06b6d4"/>
      <text x="313" y="127" fill="#cbd5e1">4,917 /s (p50 10.2ms)</text>

      <text x="0" y="162" fill="#e2e8f0">Folia</text>
      <rect x="95" y="149" width="197" height="20" rx="4" fill="#3b82f6"/>
      <text x="300" y="163" fill="#cbd5e1">4,615 /s (p50 10.8ms)</text>
    </g>
  </g>

  <!-- Panel 2: 100-Bot Play Enter Latency (ms, log-friendly visual bars) -->
  <g transform="translate(574, 114)">
    <rect width="510" height="250" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="28" fill="#f1f5f9" font-size="15" font-weight="700">2. 100-Bot Join -> Play Enter p50 (Lower is Better)</text>
    <text x="20" y="46" fill="#94a3b8" font-size="11.5">Ferrite is 2.35x faster than Pumpkin and 70.7x faster than Folia</text>

    <!-- Log scale: log10(ms) from 1 to 3.7 -> 300px -->
    <g transform="translate(20, 68)" font-size="12">
      <text x="0" y="18" fill="#fb923c" font-weight="700">Ferrite</text>
      <rect x="95" y="5" width="36" height="20" rx="4" fill="url(#ferriteBar)"/>
      <text x="139" y="19" fill="#f8fafc" font-weight="700">35.7 ms (p99 53.0 ms)</text>

      <text x="0" y="54" fill="#e2e8f0">Pumpkin</text>
      <rect x="95" y="41" width="76" height="20" rx="4" fill="#a855f7"/>
      <text x="179" y="55" fill="#cbd5e1">114.0 ms (p99 219.9 ms)</text>

      <text x="0" y="90" fill="#e2e8f0">Vanilla</text>
      <rect x="95" y="77" width="99" height="20" rx="4" fill="#64748b"/>
      <text x="202" y="91" fill="#cbd5e1">181.7 ms (p99 730.6 ms)</text>

      <text x="0" y="126" fill="#e2e8f0">Paper</text>
      <rect x="95" y="113" width="168" height="20" rx="4" fill="#06b6d4"/>
      <text x="271" y="127" fill="#cbd5e1">602.6 ms (p99 2,527 ms)</text>

      <text x="0" y="162" fill="#e2e8f0">Folia</text>
      <rect x="95" y="149" width="285" height="20" rx="4" fill="#3b82f6"/>
      <text x="388" y="163" fill="#cbd5e1">3,427 ms</text>
    </g>
  </g>

  <!-- Panel 3: 100-Bot Peak RSS (MB) -->
  <g transform="translate(36, 384)">
    <rect width="510" height="250" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="28" fill="#f1f5f9" font-size="15" font-weight="700">3. 100-Bot Peak Memory VmRSS (Lower is Better)</text>
    <text x="20" y="46" fill="#94a3b8" font-size="11.5">Ferrite uses the lowest peak memory under 100 concurrent players</text>

    <!-- Max 2700 MB -> width 310 -->
    <g transform="translate(20, 68)" font-size="12">
      <text x="0" y="18" fill="#fb923c" font-weight="700">Ferrite</text>
      <rect x="95" y="5" width="63" height="20" rx="4" fill="url(#ferriteBar)"/>
      <text x="166" y="19" fill="#f8fafc" font-weight="700">550.5 MB</text>

      <text x="0" y="54" fill="#e2e8f0">Pumpkin</text>
      <rect x="95" y="41" width="72" height="20" rx="4" fill="#a855f7"/>
      <text x="175" y="55" fill="#cbd5e1">625.0 MB</text>

      <text x="0" y="90" fill="#e2e8f0">Vanilla</text>
      <rect x="95" y="77" width="241" height="20" rx="4" fill="#64748b"/>
      <text x="344" y="91" fill="#cbd5e1">2,095.3 MB</text>

      <text x="0" y="126" fill="#e2e8f0">Folia</text>
      <rect x="95" y="113" width="290" height="20" rx="4" fill="#3b82f6"/>
      <text x="393" y="127" fill="#cbd5e1">2,526.9 MB</text>

      <text x="0" y="162" fill="#e2e8f0">Paper</text>
      <rect x="95" y="149" width="297" height="20" rx="4" fill="#06b6d4"/>
      <text x="400" y="163" fill="#cbd5e1">2,585.6 MB</text>
    </g>
  </g>

  <!-- Panel 4: Cold Boot Ready Time (ms) -->
  <g transform="translate(574, 384)">
    <rect width="510" height="250" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="28" fill="#f1f5f9" font-size="15" font-weight="700">4. Cold Boot to SLP Ready (Lower is Better)</text>
    <text x="20" y="46" fill="#94a3b8" font-size="11.5">Rust native boot (~0.12s) vs JVM servers (9.1s - 13.3s)</text>

    <g transform="translate(20, 68)" font-size="12">
      <text x="0" y="18" fill="#fb923c" font-weight="700">Ferrite</text>
      <rect x="95" y="5" width="8" height="20" rx="3" fill="url(#ferriteBar)"/>
      <text x="111" y="19" fill="#f8fafc" font-weight="700">118.2 ms (112x faster than Paper)</text>

      <text x="0" y="54" fill="#e2e8f0">Pumpkin</text>
      <rect x="95" y="41" width="10" height="20" rx="3" fill="#a855f7"/>
      <text x="113" y="55" fill="#cbd5e1">145.6 ms</text>

      <text x="0" y="90" fill="#e2e8f0">Vanilla</text>
      <rect x="95" y="77" width="205" height="20" rx="4" fill="#64748b"/>
      <text x="308" y="91" fill="#cbd5e1">9,106.0 ms</text>

      <text x="0" y="126" fill="#e2e8f0">Folia</text>
      <rect x="95" y="113" width="287" height="20" rx="4" fill="#3b82f6"/>
      <text x="390" y="127" fill="#cbd5e1">12,758.2 ms</text>

      <text x="0" y="162" fill="#e2e8f0">Paper</text>
      <rect x="95" y="149" width="300" height="20" rx="4" fill="#06b6d4"/>
      <text x="403" y="163" fill="#cbd5e1">13,331.4 ms</text>
    </g>
  </g>

  <text x="36" y="662" fill="#64748b" font-size="11">Ferrite 1.3.0 (Rust Edition 2024, rustc 1.100.0, LTO=fat) · Generated 2026-11-25</text>
</svg>