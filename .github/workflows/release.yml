name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and update
        required: true
        default: v0.2.1
      source_ref:
        description: Branch or commit to build for a new release tag
        required: true
        default: main
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-x86_64
            os: ubuntu-latest
            toolchain: stable
            python: python3
          - platform: windows-x86_64
            os: windows-latest
            toolchain: stable-x86_64-pc-windows-msvc
            python: python

    steps:
      - uses: actions/checkout@v4
        with:
          # A manually dispatched release may create a new tag, so the build
          # must check out its source ref rather than the not-yet-existing tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_ref || github.ref_name }}

      - name: Install Rust (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache vanilla data
        uses: actions/cache@v4
        with:
          path: vanilla
          key: vanilla-release-${{ runner.os }}-${{ hashFiles('tools/fetch_vanilla.py', 'tools/extractor/**') }}

      - name: Fetch vanilla data
        run: ${{ matrix.python }} tools/fetch_vanilla.py

      - name: Build server
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo build --release -p ferrite-server

      - name: Package Ubuntu release
        if: matrix.platform == 'ubuntu-x86_64'
        shell: bash
        run: |
          mkdir -p package
          cp target/release/ferrite-server package/
          cp LICENSE NOTICE.md package/
          cat > package/START-HERE.txt <<'EOF'
          Ferrite — Ubuntu x86_64 portable build

          Run ./ferrite-server --headless from a Ferrite working directory.
          This archive does not include vanilla game data. Prepare
          vanilla/26.3/generated/ using Java 25 and tools/fetch_vanilla.py.
          On first run, read the Minecraft EULA and edit eula.txt to eula=true
          only if you agree.

          Ferrite is licensed under GPL-3.0-or-later. See LICENSE and NOTICE.md.
          EOF
          tar -czf "Ferrite-${{ github.event.inputs.tag || github.ref_name }}-ubuntu-x86_64.tar.gz" -C package .

      - name: Package Windows release
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item target/release/ferrite-server.exe package/
          Copy-Item LICENSE, NOTICE.md package/
          @"
          Ferrite — Windows x64 portable build

          Double-click ferrite-server.exe to open the desktop UI, or run
          ferrite-server.exe --headless for the terminal console.
          This archive does not include vanilla game data. Prepare
          vanilla\26.3\generated\ using Java 25 and tools/fetch_vanilla.py.
          On first run, read the Minecraft EULA and edit eula.txt to eula=true
          only if you agree.

          The desktop UI requires Microsoft Edge WebView2 Runtime.
          Ferrite is licensed under GPL-3.0-or-later. See LICENSE and NOTICE.md.
          "@ | Set-Content -Encoding utf8 package/START-HERE.txt
          Compress-Archive -Path package/* -DestinationPath "Ferrite-${{ github.event.inputs.tag || github.ref_name }}-windows-x86_64.zip"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Ferrite-${{ github.event.inputs.tag || github.ref_name }}-${{ matrix.platform }}
          path: |
            Ferrite-*.tar.gz
            Ferrite-*.zip
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "Ferrite ${TAG#v}" --generate-notes
          fi
          gh release upload "$TAG" --repo "$REPO" packages/Ferrite-* --clobber

      - name: Update package notes and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$REPO" --json body --jq .body > release-notes.md
          ubuntu_sha=$(sha256sum "packages/Ferrite-${TAG}-ubuntu-x86_64.tar.gz" | cut -d' ' -f1)
          windows_sha=$(sha256sum "packages/Ferrite-${TAG}-windows-x86_64.zip" | cut -d' ' -f1)
          export TAG ubuntu_sha windows_sha
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("release-notes.md")
          body = path.read_text()
          marker = "## Windows package"
          if marker in body:
              body = body[:body.index(marker)]
          tag = os.environ["TAG"]
          body += f"""## Release packages

          The portable packages contain the Ferrite server binary, `LICENSE`, `NOTICE.md`, and
          `START-HERE.txt`. Vanilla-generated data is not bundled; follow `START-HERE.txt` to
          prepare it locally.

          - **Ubuntu x86_64:** `Ferrite-{tag}-ubuntu-x86_64.tar.gz`
            SHA-256: `{os.environ["ubuntu_sha"]}`
          - **Windows x86_64:** `Ferrite-{tag}-windows-x86_64.zip`
            SHA-256: `{os.environ["windows_sha"]}`

          The Windows desktop UI requires the WebView2 runtime. Ubuntu runs headless with
          `./ferrite-server --headless`.
          """
          path.write_text(body)
          PY
          gh release edit "$TAG" --repo "$REPO" --notes-file release-notes.md
