[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["crates/target"]

[workspace.package]
version = "1.2.1"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
ferrite-nbt = { path = "crates/ferrite-nbt" }
ferrite-protocol = { path = "crates/ferrite-protocol" }
ferrite-net = { path = "crates/ferrite-net" }
ferrite-region = { path = "crates/ferrite-region" }
ferrite-world = { path = "crates/ferrite-world" }
ferrite-worldgen = { path = "crates/ferrite-worldgen" }
ferrite-light = { path = "crates/ferrite-light" }
ferrite-data = { path = "crates/ferrite-data" }

thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v3", "v4"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
parking_lot = "0.12"
crossbeam = "0.8"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.ferrite-light]
opt-level = 2
